version: 2

# ce qui utilise nos modeles hors dbt (fin du lineage)
exposures:
  - name: sales_dashboard
    label: Sales dashboard (Metabase)
    type: dashboard
    maturity: high
    owner:
      name: Sara Martin
      email: sara.martin@shopfast.example
    depends_on:
      - ref('fct_orders')
    description: "Daily revenue, orders and conversion per channel. Opened every morning by the CEO."

  - name: finance_monthly_revenue_report
    label: Finance monthly revenue report
    type: analysis
    maturity: high
    owner:
      name: Paul Girard
      email: paul.girard@shopfast.example
    depends_on:
      - ref('fct_orders')
    description: "Monthly net revenue for the board report and the annual accounts."

  - name: churn_prediction_model
    label: Churn prediction ML model
    type: ml
    maturity: medium
    owner:
      name: Data Science team
      email: data-science@shopfast.example
    depends_on:
      - ref('dim_customers')
    description: "Churn score per customer account, uses last_order_date, lifetime_orders and lifetime_net_revenue_eur."
