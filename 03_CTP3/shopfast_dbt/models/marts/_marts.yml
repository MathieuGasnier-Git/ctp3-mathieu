version: 2

models:
  - name: fct_orders
    description: "One row per order with gross, refunded and net revenue. Source of the Sales dashboard and the Finance report."
    meta:
      owner: "Sara Martin (Head of Sales)"
      steward: "Karim Benali (Analytics Engineer)"
      domain: sales
      tier: gold
    columns:
      - name: order_id
        description: "{{ doc('order') }}"
        data_tests: [unique, not_null]
      - name: customer_id
        description: "Account that placed the order."
        tags: ['pii']
        meta: {classification: confidential}
        data_tests: [not_null]
      - name: order_date
        description: "Order date (YYYY-MM-DD)."
      - name: status
        description: "Order status."
        data_tests:
          - accepted_values:
              arguments:
                values: ['pending', 'shipped', 'delivered', 'cancelled', 'returned']
      - name: channel
        description: "web, mobile_app or marketplace."
      - name: shipping_country
        description: "Delivery country code."
      - name: gross_revenue_eur
        description: "{{ doc('gross_revenue') }}"
      - name: refunded_eur
        description: "Refunded amount of the order in euros, VAT included. 0 if no refund."
      - name: net_revenue_eur
        description: "{{ doc('net_revenue') }}"

  - name: dim_customers
    description: "One row per customer account with profile and lifetime metrics. Used by the churn model."
    meta:
      owner: "Sara Martin (Head of Sales)"
      steward: "Karim Benali (Analytics Engineer)"
      domain: customer
      tier: gold
    columns:
      - name: customer_id
        description: "{{ doc('customer') }}"
        tags: ['pii']
        meta: {classification: confidential}
        data_tests: [unique, not_null]
      - name: first_name
        description: "First name."
        tags: ['pii']
        meta: {classification: confidential}
      - name: last_name
        description: "Last name."
        tags: ['pii']
        meta: {classification: confidential}
      - name: email
        description: "Login email."
        tags: ['pii']
        meta: {classification: confidential}
      - name: country_code
        description: "Country code: FR, DE, ES or BE."
        data_tests:
          - accepted_values:
              arguments:
                values: ['FR', 'DE', 'ES', 'BE']
      - name: loyalty_tier
        description: "bronze, silver, gold or platinum."
      - name: signup_date
        description: "Account creation date."
      - name: has_marketing_consent
        description: "True if the customer accepted marketing emails."
        tags: ['pii']
        meta: {classification: confidential}
      - name: lifetime_orders
        description: "Number of orders of the account, all statuses."
      - name: last_order_date
        # inclut les annulees, donc pas suffisant pour active customer
        description: |
          Last order date of the account, cancelled orders included. Null if no order.

          {{ doc('active_customer') }}

          {{ doc('recently_active_customer') }}

          {{ doc('churned_customer') }}
      - name: lifetime_net_revenue_eur
        description: |
          Total net revenue of the account in euros. 0 if no order.

          {{ doc('net_revenue') }}
