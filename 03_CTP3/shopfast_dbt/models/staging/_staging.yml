version: 2

# ex 1 : owner = qui decide (inventaire CM 2), steward = qui maintient le modele
# colonnes perso : tag pii + classification

models:
  - name: stg_customers
    description: "One row per customer account, cleaned from raw.customers (exact duplicate rows removed, ISO country codes, ISO dates)."
    meta:
      owner: "Sara Martin (Head of Sales)"
      steward: "Karim Benali (Analytics Engineer)"
      domain: customer
      tier: gold
    columns:
      - name: customer_id
        description: "Id of the customer account. One person can have several accounts. Links orders and payments to a person."
        tags: ['pii']
        meta: {classification: confidential}
        data_tests: [unique, not_null]
      - name: first_name
        description: "First name, trimmed, capital first letter."
        tags: ['pii']
        meta: {classification: confidential}
      - name: last_name
        description: "Last name, trimmed, capital first letter."
        tags: ['pii']
        meta: {classification: confidential}
      - name: email
        description: "Login email, trimmed and lower-cased. Empty for 48 accounts."
        tags: ['pii']
        meta: {classification: confidential}
      - name: phone
        description: "Phone number as typed by the customer, format not cleaned."
        tags: ['pii']
        meta: {classification: confidential}
      - name: birth_date
        description: "Birth date (YYYY-MM-DD). Some wrong values (future dates, 1899-01-01)."
        # restricted : avec le nom ca identifie la personne
        tags: ['pii']
        meta: {classification: restricted}
      - name: city
        description: "City of the customer address."
        tags: ['pii']
        meta: {classification: confidential}
      - name: country_code
        description: "Country code: FR, DE, ES or BE. Null if unknown."
        data_tests:
          - accepted_values:
              arguments:
                values: ['FR', 'DE', 'ES', 'BE']
      - name: signup_date
        description: "Date the account was created (YYYY-MM-DD)."
      - name: has_marketing_consent
        description: "True if the customer accepted marketing emails (GDPR consent)."
        tags: ['pii']
        meta: {classification: confidential}
      - name: loyalty_tier
        description: "Loyalty level, lower-cased ('platinium' fixed to 'platinum')."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['bronze', 'silver', 'gold', 'platinum']

  - name: stg_orders
    description: "One row per order (duplicates removed) with date, channel, country, status and total in euros."
    meta:
      owner: "Sara Martin (Head of Sales)"
      steward: "Karim Benali (Analytics Engineer)"
      domain: sales
      tier: silver
    columns:
      - name: order_id
        description: "Id of the order."
        data_tests: [unique, not_null]
      - name: customer_id
        description: "Account that placed the order. 14 orders have an unknown customer."
        tags: ['pii']
        meta: {classification: confidential}
        data_tests: [not_null]
      - name: order_date
        description: "Order date (YYYY-MM-DD). Null for 11 orders, a few in the future."
      - name: status
        description: "Order status, lower-cased ('canceled' fixed to 'cancelled')."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['pending', 'shipped', 'delivered', 'cancelled', 'returned']
      - name: channel
        description: "Where the order was placed."
        data_tests:
          - accepted_values:
              arguments:
                values: ['web', 'mobile_app', 'marketplace']
      - name: shipping_country
        description: "Delivery country code."
        data_tests:
          - accepted_values:
              arguments:
                values: ['FR', 'DE', 'ES', 'BE']
      - name: total_amount_eur
        description: "Order total in EUROS with 2 decimals, VAT and shipping included, before refunds."

  - name: stg_order_items
    description: "One row per product line of an order."
    meta:
      owner: "Sara Martin (Head of Sales)"
      steward: "Karim Benali (Analytics Engineer)"
      domain: sales
      tier: silver
    columns:
      - name: order_item_id
        description: "Id of the order line."
        data_tests: [unique, not_null]
      - name: order_id
        description: "Order of the line."
      - name: product_id
        description: "Product sold. Product 999 does not exist."
      - name: quantity
        description: "Units bought. A few lines are 0 or negative."
      - name: unit_price_eur
        description: "Price of one unit in EUROS with 2 decimals, VAT included."

  - name: stg_payments
    description: "One row per payment event from the payment provider (captured or refunded)."
    meta:
      owner: "Paul Girard (Head of Finance)"
      steward: "Karim Benali (Analytics Engineer)"
      domain: finance
      tier: silver
    columns:
      - name: payment_id
        description: "Id of the payment event."
        data_tests: [unique, not_null]
      - name: order_id
        description: "Order paid or refunded."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: payment_date
        description: "Date of the payment or refund (YYYY-MM-DD)."
      - name: method
        description: "Payment method."
        data_tests:
          - accepted_values:
              arguments:
                values: ['card', 'paypal', 'bank_transfer', 'apple_pay']
      - name: amount
        # unite du cm : euros, pas centimes
        description: "Amount in EUROS with 2 decimals (54.50 = 54.50 EUR), NOT cents. Always positive, see payment_status."
        data_tests: [not_null]
      - name: currency
        description: "Currency of amount, only EUR."
        data_tests:
          - accepted_values:
              arguments:
                values: ['EUR']
      - name: card_last4
        description: "Last 4 digits of the card. Linked to a person through order_id, need-to-know access. Also filled for some non-card payments."
        tags: ['pii']
        meta: {classification: restricted}
      - name: payment_status
        description: "captured = money received, refunded = money sent back."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['captured', 'refunded']

  - name: stg_products
    description: "Product catalogue with price, category, supplier and active flag."
    meta:
      owner: "Product Catalog Manager (Merchandising)"
      steward: "Karim Benali (Analytics Engineer)"
      domain: product
      tier: silver
    columns:
      - name: product_id
        description: "Id of the product."
        data_tests: [unique, not_null]
      - name: sku
        description: "SKU code. Not unique, SF-FAS-0522 is used twice."
      - name: product_name
        description: "Product name."
      - name: category
        description: "Product category, capital first letter."
        data_tests:
          - accepted_values:
              arguments:
                values: ['Beauty', 'Books', 'Electronics', 'Fashion', 'Home', 'Sports']
      - name: list_price_eur
        description: "Catalogue price in EUROS with 2 decimals, VAT included. One missing, one negative."
      - name: supplier
        description: "Supplier name."
      - name: is_active
        description: "True if still on sale."
