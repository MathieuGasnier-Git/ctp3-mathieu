version: 2

models:
  - name: fct_orders
    description: "One row per order with gross, refunded and net revenue. Source of the Sales dashboard and the Finance report."
    meta:
      owner: "Sara Martin (Head of Sales)"
      steward: "Karim Benali (Analytics Engineer)"
      domain: sales
      tier: gold
    columns:
      - name: order_id
        description: "{{ doc('order') }}"
        data_tests: [unique, not_null]
      - name: customer_id
        description: "Customer account that placed the order (key to dim_customers)."
        tags: ['pii']
        meta: {classification: confidential}
        data_tests: [not_null]
      - name: order_date
        description: "Date the order was placed (DATE, YYYY-MM-DD)."
      - name: status
        description: "Lifecycle status of the order."
        data_tests:
          - accepted_values:
              arguments:
                values: ['pending', 'shipped', 'delivered', 'cancelled', 'returned']
      - name: channel
        description: "Sales channel where the order was placed (web, mobile_app, marketplace)."
      - name: shipping_country
        description: "Delivery country as ISO 3166 alpha-2 code."
      - name: gross_revenue_eur
        description: "{{ doc('gross_revenue') }}"
      - name: refunded_eur
        description: "Sum of the refunded payments of the order in EUROS with 2 decimals, VAT included. 0 if no refund."
      - name: net_revenue_eur
        description: "{{ doc('net_revenue') }}"

  - name: dim_customers
    description: "One row per customer account with its profile and lifetime order metrics. Used by the churn model and customer segmentation."
    meta:
      owner: "Sara Martin (Head of Sales)"
      steward: "Karim Benali (Analytics Engineer)"
      domain: customer
      tier: gold
    columns:
      - name: customer_id
        description: "{{ doc('customer') }}"
        tags: ['pii']
        meta: {classification: confidential}
        data_tests: [unique, not_null]
      - name: first_name
        description: "First name of the customer."
        tags: ['pii']
        meta: {classification: confidential}
      - name: last_name
        description: "Last name of the customer."
        tags: ['pii']
        meta: {classification: confidential}
      - name: email
        description: "Login email, lower-cased."
        tags: ['pii']
        meta: {classification: confidential}
      - name: country_code
        description: "Country of the customer as ISO 3166 alpha-2 code (FR, DE, ES, BE)."
        data_tests:
          - accepted_values:
              arguments:
                values: ['FR', 'DE', 'ES', 'BE']
      - name: loyalty_tier
        description: "Loyalty programme level (bronze, silver, gold, platinum)."
      - name: signup_date
        description: "Date the customer account was created."
      - name: has_marketing_consent
        description: "True if the customer agreed to receive marketing emails (GDPR consent)."
        tags: ['pii']
        meta: {classification: confidential}
      - name: lifetime_orders
        description: "Number of orders placed by the account since signup, all statuses included."
      - name: last_order_date
        description: |
          Date of the most recent order of the account, all statuses included (cancelled too). Null if the account never ordered. Do not use it alone to count active customers:

          {{ doc('active_customer') }}

          {{ doc('recently_active_customer') }}

          {{ doc('churned_customer') }}
      - name: lifetime_net_revenue_eur
        description: |
          Sum of the net revenue of all orders of the account (euros, VAT excluded). 0 if no order.

          {{ doc('net_revenue') }}
